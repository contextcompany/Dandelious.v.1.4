<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Slightly grayish lime green background -->
    <rect id="bg" width="512" height="512" rx="112" fill="#7a9a60" />
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba870"/>
      <stop offset="100%" stop-color="#6e8c56"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle modern rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#limeGrad)" />

  <!-- Dandelion Silhouette in clean, pure white -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main stem -->
    <path d="M 256 260 Q 254 360 250 440" stroke="#ffffff" stroke-width="12" fill="none"/>
    
    <!-- Central seed head -->
    <circle cx="256" cy="240" r="14" fill="#ffffff" stroke="none"/>

    <!-- Radiating fluff filaments & seeds -->
    <!-- 0 deg (top) -->
    <line x1="256" y1="240" x2="256" y2="130" stroke-width="4"/>
    <circle cx="256" cy="130" r="5"/>
    <line x1="256" y1="130" x2="242" y2="114" stroke-width="3"/>
    <line x1="256" y1="130" x2="270" y2="114" stroke-width="3"/>
    <line x1="256" y1="130" x2="256" y2="108" stroke-width="3"/>

    <!-- 30 deg -->
    <line x1="256" y1="240" x2="310" y2="145" stroke-width="4"/>
    <circle cx="310" cy="145" r="5"/>
    <line x1="310" y1="145" x2="312" y2="124" stroke-width="3"/>
    <line x1="310" y1="145" x2="330" y2="136" stroke-width="3"/>

    <!-- 60 deg -->
    <line x1="256" y1="240" x2="355" y2="185" stroke-width="4"/>
    <circle cx="355" cy="185" r="5"/>
    <line x1="355" y1="185" x2="374" y2="172" stroke-width="3"/>
    <line x1="355" y1="185" x2="376" y2="194" stroke-width="3"/>

    <!-- 90 deg (right) -->
    <line x1="256" y1="240" x2="368" y2="240" stroke-width="4"/>
    <circle cx="368" cy="240" r="5"/>
    <line x1="368" y1="240" x2="388" y2="228" stroke-width="3"/>
    <line x1="368" y1="240" x2="388" y2="252" stroke-width="3"/>

    <!-- 120 deg -->
    <line x1="256" y1="240" x2="340" y2="290" stroke-width="4"/>
    <circle cx="340" cy="290" r="5"/>
    <line x1="340" y1="290" x2="358" y2="304" stroke-width="3"/>
    <line x1="340" y1="290" x2="352" y2="312" stroke-width="3"/>

    <!-- 150 deg -->
    <line x1="256" y1="240" x2="295" y2="315" stroke-width="4"/>
    <circle cx="295" cy="315" r="4.5"/>
    <line x1="295" y1="315" x2="308" y2="332" stroke-width="3"/>

    <!-- 210 deg -->
    <line x1="256" y1="240" x2="217" y2="315" stroke-width="4"/>
    <circle cx="217" cy="315" r="4.5"/>
    <line x1="217" y1="315" x2="204" y2="332" stroke-width="3"/>

    <!-- 240 deg -->
    <line x1="256" y1="240" x2="172" y2="290" stroke-width="4"/>
    <circle cx="172" cy="290" r="5"/>
    <line x1="172" y1="290" x2="154" y2="304" stroke-width="3"/>
    <line x1="172" y1="290" x2="160" y2="312" stroke-width="3"/>

    <!-- 270 deg (left) -->
    <line x1="256" y1="240" x2="144" y2="240" stroke-width="4"/>
    <circle cx="144" cy="240" r="5"/>
    <line x1="144" y1="240" x2="124" y2="228" stroke-width="3"/>
    <line x1="144" y1="240" x2="124" y2="252" stroke-width="3"/>

    <!-- 300 deg -->
    <line x1="256" y1="240" x2="157" y2="185" stroke-width="4"/>
    <circle cx="157" cy="185" r="5"/>
    <line x1="157" y1="185" x2="138" y2="172" stroke-width="3"/>
    <line x1="157" y1="185" x2="136" y2="194" stroke-width="3"/>

    <!-- 330 deg -->
    <line x1="256" y1="240" x2="202" y2="145" stroke-width="4"/>
    <circle cx="202" cy="145" r="5"/>
    <line x1="202" y1="145" x2="200" y2="124" stroke-width="3"/>
    <line x1="202" y1="145" x2="182" y2="136" stroke-width="3"/>

    <!-- Intermediate inner spokes for organic fullness -->
    <line x1="256" y1="240" x2="230" y2="170" stroke-width="3.5"/>
    <circle cx="230" cy="170" r="4"/>
    <line x1="256" y1="240" x2="282" y2="170" stroke-width="3.5"/>
    <circle cx="282" cy="170" r="4"/>
    <line x1="256" y1="240" x2="315" y2="215" stroke-width="3.5"/>
    <circle cx="315" cy="215" r="4"/>
    <line x1="256" y1="240" x2="197" y2="215" stroke-width="3.5"/>
    <circle cx="197" cy="215" r="4"/>

    <!-- Floating seeds drifting gently away in the wind (top right) -->
    <!-- Seed 1 -->
    <g transform="translate(370, 110) rotate(25)">
      <line x1="0" y1="0" x2="0" y2="35" stroke-width="3"/>
      <circle cx="0" cy="35" r="3.5"/>
      <line x1="0" y1="0" x2="-14" y2="-16" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="14" y2="-16" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-20" stroke-width="2.5"/>
    </g>

    <!-- Seed 2 (further away) -->
    <g transform="translate(420, 75) rotate(40) scale(0.85)">
      <line x1="0" y1="0" x2="0" y2="35" stroke-width="3"/>
      <circle cx="0" cy="35" r="3.5"/>
      <line x1="0" y1="0" x2="-14" y2="-16" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="14" y2="-16" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-20" stroke-width="2.5"/>
    </g>

    <!-- Seed 3 (small, top) -->
    <g transform="translate(320, 70) rotate(15) scale(0.7)">
      <line x1="0" y1="0" x2="0" y2="35" stroke-width="3"/>
      <circle cx="0" cy="35" r="3.5"/>
      <line x1="0" y1="0" x2="-14" y2="-16" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="14" y2="-16" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-20" stroke-width="2.5"/>
    </g>
  </g>
</svg>
